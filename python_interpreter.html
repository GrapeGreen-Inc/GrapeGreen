<!DOCTYPE HTML>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script defer src="https://pyscript.net/latest/pyscript.js"></script>
    <link rel="stylesheet" href="https://pyscript.net/latest/pydide.css" />
    <style>
      body { background-color: #000000; color: white; }
      html, body { margin: 0; padding: 0; }
    </style>
  </head>
  <body>
    <script>
      const processedIds = new Set();
      // Array queue tracking your active Pyodide proxy reference allocations
      const activeProxies = [];

      function manageProxyQueue(newProxy) {
        activeProxies.push(newProxy);
        
        // Garbage collection: Once we cross 5 active references, wipe the oldest one completely
        if (activeProxies.length > 5) {
          const oldProxy = activeProxies.shift();
          try {
            oldProxy.destroy(); // Explicitly clear Pyodide WebAssembly memory allocation slots
          } catch (e) {
            console.error('Failed to destroy expired proxy instance profile:', e);
          }
        }
      }

      function tryDispatch() {
        try {
          const rawData = localStorage.getItem('myAppData');
          if (!rawData) return;

          const data = JSON.parse(rawData);
          const { ID, payload, "passcode token": passcodeToken, "run?": runStatus } = data;
          const shouldRun = runStatus === true || runStatus === 'true';

          if (ID && shouldRun && !processedIds.has(ID)) {
            processedIds.add(ID);

            // Verify both the core wrapper function and the Pyodide proxy factory are ready
            if (window.getRawPythonExecution && window.createPyodideProxy) {
              const rawPythonFn = window.getRawPythonExecution();
              
              // Wrap the raw Python logic into a disposable JS proxy container reference
              const disposableProxy = window.createPyodideProxy(rawPythonFn);
              
              // Pass through the tracking garbage collection stack allocation rules
              manageProxyQueue(disposableProxy);

              // Execute payload dynamically using the newly provisioned active bridge
              disposableProxy(ID, payload, passcodeToken);
            } else {
              console.warn('Python engine structures or factory vectors are not fully initialized.');
            }
          }
        } catch (error) {
          console.error('Error in tryDispatch:', error);
        }
      }

      window.addEventListener('py:ready', () => {
        setInterval(tryDispatch, 100);
      });
    </script>

    <script type="py">
import sys
from js import window
from pyodide.ffi import create_proxy

# Pre-import safe modules into the environment so users don't have to call '__import__'
import time
import datetime
import math

def my_python_execution(payload_id, payload, token):
    try:
        # 1. Establish isolated built-ins dictionary copy
        safe_builtins = __builtins__.dict().copy() if hasattr(__builtins__, 'dict') else dict(__builtins__)
        
        # 2. Prevent executing arbitrary strings or changing standard file tracks
        blacklisted_builtins = ['open', 'eval', 'exec', 'compile', 'importlib', '__import__', 'input']
        for name in blacklisted_builtins:
            if name in safe_builtins:
                del safe_builtins[name]

        # 3. Supply safe modules directly into the execution scope
        safe_globals = {
            "__builtins__": safe_builtins,
            "print": print,
            "id": id,
            "token": token,
            "time": time,
            "datetime": datetime,
            "math": math
        }
        
        # 4. Run payload strictly bound inside the sandbox environment
        exec(payload, safe_globals, {})
        
    except Exception as e:
        print(f"Sandbox restricted execution error: {e}")

# Provide helper methods directly to the window layer to decouple initialization runtime loops
window.getRawPythonExecution = create_proxy(lambda: my_python_execution)
window.createPyodideProxy = create_proxy(lambda fn: create_proxy(fn))
    </script>
  </body>
</html>
