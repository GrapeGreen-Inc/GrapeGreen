<!DOCTYPE HTML>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script defer src="https://pyscript.net/latest/pyscript.js"></script>
    <link rel="stylesheet" href="https://pyscript.net/latest/pydide.css" />
    <style>
      body { background-color: #000000; color: white; }
      html, body { margin: 0; padding: 0; }
    </style>
  </head>
  <body>
    <script>
      const processedIds = new Set();
      const activeProxies = [];

      function manageProxyQueue(newProxy) {
        activeProxies.push(newProxy);
        if (activeProxies.length > 5) {
          const oldProxy = activeProxies.shift();
          try {
            oldProxy.destroy();
          } catch (e) {
            console.error('Failed to destroy expired proxy instance:', e);
          }
        }
      }

      function tryDispatch() {
        try {
          const rawData = localStorage.getItem('myAppData');
          if (!rawData) return;

          const data = JSON.parse(rawData);
          const { ID, payload, "passcode token": passcodeToken, "run?": runStatus } = data;
          const shouldRun = runStatus === true || runStatus === 'true';

          if (ID && shouldRun && !processedIds.has(ID)) {
            processedIds.add(ID);

            if (window.getRawPythonExecution && window.createPyodideProxy) {
              const rawPythonFn = window.getRawPythonExecution();
              const disposableProxy = window.createPyodideProxy(rawPythonFn);
              
              manageProxyQueue(disposableProxy);
              disposableProxy(ID, payload, passcodeToken);
            } else {
              console.warn('Python engine structures are not fully initialized.');
            }
          }
        } catch (error) {
          console.error('Error in tryDispatch:', error);
        }
      }

      window.addEventListener('py:ready', () => {
        setInterval(tryDispatch, 100);
      });
    </script>

    <script type="py">
import sys
from js import window
from pyodide.ffi import create_proxy

# 1. Network Guard: Patch the underlying Pyodide network hooks to block out requests
import pyodide
_original_fetch = window.fetch

def restricted_fetch(url, options=None):
    url_str = str(url).lower()
    
    # Allowed domains for background database integrations
    allowed_domains = ["firebaseio.com", "googleapis.com", "grapegreen"]
    
    if any(domain in url_str for domain in allowed_domains):
        return _original_fetch(url, options)
    
    raise PermissionError("Network request blocked by GrapeGreen Sandbox policies.")

window.fetch = create_proxy(restricted_fetch)

# 2. Whitelist Import Hook updated with LAN server modules
ALLOWED_MODULES = {
    'time', 'datetime', 'math', 'hashlib', 'json',
    'urllib', 'urllib.request',
    'turtle', 'tkinter', 'tkinter.messagebox',
    'socket', 'http', 'http.server'  # 👈 Added core modules needed for LAN servers
}

class SandboxImportBlocker:
    def find_spec(self, fullname, path, target=None):
        base_module = fullname.split('.')[0]
        if fullname not in ALLOWED_MODULES and base_module not in ALLOWED_MODULES:
            raise ImportError(f"Import of module '{fullname}' is forbidden in this sandbox.")
        return None

sys.meta_path.insert(0, SandboxImportBlocker())

def my_python_execution(payload_id, payload, token):
    try:
        # Keep built-ins functional so standard statements like 'import' work normally
        safe_builtins = __builtins__.dict().copy() if hasattr(__builtins__, 'dict') else dict(__builtins__)
        
        # Remove execution modifiers to prevent direct sandbox escapes
        blacklisted_builtins = ['open', 'eval', 'exec', 'compile', 'input']
        for name in blacklisted_builtins:
            if name in safe_builtins:
                del safe_builtins[name]

        safe_globals = {
            "__builtins__": safe_builtins,
            "print": print,
            "id": id,
            "token": token
        }
        
        exec(payload, safe_globals, {})
        
    except Exception as e:
        print(f"Sandbox restricted execution error: {e}")

window.getRawPythonExecution = create_proxy(lambda: my_python_execution)
window.createPyodideProxy = create_proxy(lambda fn: create_proxy(fn))
    </script>
  </body>
</html>
