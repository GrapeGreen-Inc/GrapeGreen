# The name displayed on your GitHub Actions dashboard page layout
name: GrapeGreen Core Initialization

# 1. Choose WHEN to trigger the script (e.g., every time you 'git push' to main)
on:
  push:
    branches: [ "main" ]
  # Allows your HTML page to trigger this manually using the GitHub API
  repository_dispatch:
    types: [start-python-server]

# 2. Define WHAT actions the temporary cloud computer should take
jobs:
  execute-start-script:
    # Tell GitHub to spin up a fresh Ubuntu Linux virtual machine cloud server
    runs-on: ubuntu-latest

    steps:
    # Step A: Download your repository code onto the temporary cloud machine
    - name: Checkout repository code
      uses: actions/checkout@v4

    # Step B: Install Node.js to use npm installer packages
    - name: Set up Node.js Environment
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    # Step C: Install the requested Firebase libraries into the runner container workspace
    - name: Install Firebase Node Module Dependencies
      run: |
        npm install firebase

    # Step D: Install a clean version of Python on that cloud machine
    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # Step E: Run your start.py script file cleanly
    - name: Run start.py file
      run: |
        python start.py
