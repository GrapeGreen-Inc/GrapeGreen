# The name displayed on your GitHub Actions dashboard page layout
name: GrapeGreen Core Initialization

# 1. Choose WHEN to trigger the script (e.g., every time you 'git push' to main)
on:
  push:
    branches: [ "main" ]
  # Allows your HTML page to trigger this manually using the GitHub API
  repository_dispatch:
    types: [start-python-server]

# 2. Define WHAT actions the temporary cloud computer should take
jobs:
  execute-start-script:
    # Tell GitHub to spin up a fresh Ubuntu Linux virtual machine cloud server
    runs-on: ubuntu-latest

    steps:
    # Step A: Download your repository code onto the temporary cloud machine
    - name: Checkout repository code
      uses: actions/checkout@v4

    # Step B: Install a clean version of Python on that cloud machine
    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # Step C: Install the requested Python Firebase libraries into the runner environment
    - name: Install Python Firebase Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install firebase-admin

    # Step D: Run your start.py script file cleanly
    - name: Run start.py file
      run: |
        python start.py

    # 🔄 Step E: Automatically save and push python_logs.json back to your repo!
    - name: Auto-Commit Python Server Logs
      if: always() # 🛡️ Ensures this runs even if the server hits a timeout or is stopped!
      env:
        # Pull down your encrypted token secret safely into the temporary server terminal environment
        LAUNCH_KEY: ${{ secrets.GRAPEGREEN_LAUNCH_TOKEN }}
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@://github.com"
        git add python_logs.json
        
        # Commit the changes or echo a safe message if no updates were written
        git commit -m "chore: automated background ledger update [skip ci]" || echo "No log changes to commit"
        
        # Inject your secret token key directly into the push path so GitHub authorizes the remote write!
        git push https://x-access-token:${LAUNCH_KEY}@://github.com HEAD:main
