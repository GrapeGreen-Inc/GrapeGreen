<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verification Screen</title>
    <!-- Load Google reCAPTCHA API -->
    <script src="https://google.com" async defer></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: #1e1e1e;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #e0e0e0;
        }

        p {
            font-size: 14px;
            color: #a0a0a0;
            margin-bottom: 30px;
        }

        .captcha-container {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }

        /* Responsive container to prevent reCAPTCHA overflowing mobile screens */
        @media (max-width: 360px) {
            .g-recaptcha {
                transform: scale(0.85);
                transform-origin: 0 0;
            }
        }

        /* Secure error display element */
        .error-message {
            background-color: rgba(244, 67, 54, 0.1);
            color: #f44336;
            border: 1px solid rgba(244, 67, 54, 0.3);
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
            margin-bottom: 20px;
            display: none; /* Hidden by default */
        }

        .btn-confirm {
            background-color: #4caf50;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s, transform 0.1s;
            -webkit-tap-highlight-color: transparent; /* Fixes mobile click delay flash */
        }

        .btn-confirm:hover {
            background-color: #45a049;
        }

        .btn-confirm:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Security Check</h1>
        <p>Please complete the verification below to proceed to the application.</p>
        
        <!-- Error box replaces the browser alert popup -->
        <div id="errorBox" class="error-message"></div>

        <!-- The reCAPTCHA Widget -->
        <div class="captcha-container">
            <div class="g-recaptcha" data-theme="dark" data-sitekey="6LfV1PgtAAAAAIYTHM_VZn1zh0stTnJkDnGa3D0-"></div>
        </div>

        <!-- Confirm Button -->
        <button class="btn-confirm" onclick="validateAndRedirect()">Confirm & Proceed</button>
    </div>

    <script>
        function validateAndRedirect() {
            const errorBox = document.getElementById("errorBox");
            
            // Clear any old messages using textContent to prevent script injection strings
            errorBox.textContent = "";
            errorBox.style.display = "none";

            // Check if the user completed the reCAPTCHA challenge
            const captchaResponse = grecaptcha.getResponse();

            if (captchaResponse.length === 0) {
                // Safely insert plain text warning into the DOM layout
                errorBox.textContent = "Please check the reCAPTCHA box before continuing!";
                errorBox.style.display = "block";
            } else {
                // Clean execution redirect inside the exact same folder structure
                window.location.href = "redirect.html";
            }
        }
    </script>

</body>
</html>
