<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GrapeGreen Dashboard</title>
    <meta name="google-site-verification" content="fmyON1NT93BBauxVZgKp1pQLbNJT9lwLviVvZmDlKDc" />
    <link rel="icon" type="image/png" href="/favicon.png">
    <meta name="keywords" content="wall of memes, chat, grapegreen, grape, green, grapegreen-inc, grape ai, artificial intelligence, users, coding, V1.5.2, github, public chat, users, users lookup, website, dashboard, site">
  <meta name="description" content="Welcome to GrapeGreen! Manage your custom dashboard, browse the wall of memes, chat with friends, and try out the Grape AI pre-release">
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
    <style>
        :root {
            --bg-color: #2c1a4d;
            --panel-bg: #3d256c;
            --text-main: #ffffff;
            --text-sub: #cbc3e3;
            --accent: #a3e635;
            --shadow: rgba(0, 0, 0, 0.3);
        }
        .light-variant {
            --bg-color: #f4f0fa;
            --panel-bg: #ffffff;
            --text-main: #1a0d33;
            --text-sub: #5c4d75;
            --accent: #65a30d;
            --shadow: rgba(44, 26, 77, 0.15);
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: var(--bg-color);
            margin: 0;
            transition: background-color 0.3s ease;
        }
        .container {
            text-align: center;
            padding: 35px;
            background: var(--panel-bg);
            border-radius: 12px;
            box-shadow: 0 8px 24px var(--shadow);
            max-width: 420px;
            width: 100%;
            box-sizing: border-box;
            transition: background-color 0.3s ease, box-shadow 0.3s ease;
        }
        h1 {
            font-size: 42px;
            font-weight: bold;
            color: var(--text-main);
            margin: 0 0 20px 0;
            letter-spacing: -1px;
        }
        p {
            color: var(--text-sub);
            font-size: 15px;
            margin-bottom: 25px;
            line-height: 1.4;
        }
        .feedback-widget {
            position: fixed;
            bottom: 15px;
            right: 15px;
            display: flex;
            align-items: center;
            background: var(--panel-bg);
            border: 1px solid rgba(163, 230, 53, 0.2);
            border-radius: 4px;
            padding: 8px 12px;
            box-shadow: 0 2px 10px var(--shadow);
            font-size: 13px;
            z-index: 9999;
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }
        .feedback-text {
            color: var(--text-sub);
            margin-right: 12px;
            font-weight: 500;
        }
        .feedback-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
            padding: 4px;
            margin: 0 2px;
            border-radius: 4px;
            transition: transform 0.1s ease, background-color 0.2s ease;
        }
        .feedback-btn:hover {
            background-color: rgba(163, 230, 53, 0.15);
            transform: scale(1.15);
        }
        .feedback-btn:disabled {
            opacity: 0.4;
            cursor: default;
            background: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Grape<span style="color: var(--accent);">Green</span></h1>
        <p>Please complete the verification challenge below to continue.</p>
        <div id="recaptcha-widget"></div>
    </div>
    <div class="feedback-widget" id="feedback-badge">
        <span class="feedback-text" id="feedback-msg">Rate this theme?</span>
        <button class="feedback-btn" id="vote-up-btn" title="Thumbs Up">👍</button>
        <button class="feedback-btn" id="vote-down-btn" title="Thumbs Down">👎</button>
    </div>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-analytics.js";
        import { getFirestore, doc, getDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";
        import { getRemoteConfig, fetchAndActivate, getString } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-remote-config.js";
        const RECAPTCHA_PUBLIC_KEY = "6LcdDPktAAAAAHHNyGbwuZKF-63BNr-_35b6Rxh5";
        let recaptchaSecretKey = null;
        let activeVariant = "dark";
        const firebaseConfig = {
            apiKey: "AIzaSyAqy6NWFJ1KD9Cfv_WyqbMJJWCqlC5P7Es",
            authDomain: "app-iguess-39f2f.firebaseapp.com",
            databaseURL: "https://app-iguess-39f2f-default-rtdb.firebaseio.com",
            projectId: "app-iguess-39f2f",
            storageBucket: "app-iguess-39f2f.firebasestorage.app",
            messagingSenderId: "1056619953768",
            appId: "1:1056619953768:web:6ac154660c07c48a5005dd",
            measurementId: "G-J4736J0D8J"
        };
        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const db = getFirestore(app);
        const remoteConfig = getRemoteConfig(app);
        remoteConfig.settings.minimumFetchIntervalMillis = 0;
        remoteConfig.defaultConfig = { "dashboard_theme_variant": "dark" };
        function evaluateThemeVariant() {
            fetchAndActivate(remoteConfig).then(() => {
                const variant = getString(remoteConfig, "dashboard_theme_variant");
                activeVariant = variant;
                if (variant === "light") {
                    document.body.classList.add("light-variant");
                } else {
                    document.body.classList.remove("light-variant");
                }
            }).catch((err) => console.error(err));
        }
        async function submitVote(isPositive) {
            const upBtn = document.getElementById("vote-up-btn");
            const downBtn = document.getElementById("vote-down-btn");
            const msgText = document.getElementById("feedback-msg");
            upBtn.disabled = true;
            downBtn.disabled = true;
            try {
                const docRef = doc(db, "meta", "A&B-votes");
                const fieldPath = isPositive ? `${activeVariant}_upvotes` : `${activeVariant}_downvotes`;
                await updateDoc(docRef, { [fieldPath]: increment(1) });
                msgText.innerText = "Thanks for feedback!";
            } catch (error) {
                console.error(error);
                upBtn.disabled = false;
                downBtn.disabled = false;
            }
        }
        async function fetchSecretKey() {
            try {
                const docRef = doc(db, "meta", "RECAP_KEY");
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    recaptchaSecretKey = docSnap.data().key;
                }
            } catch (error) {
                console.error(error);
            }
        }
        window.onVerificationSuccess = function(token) {
            window.location.href = "redirect.html";
        };
        function onCaptchaError() {
            const statusText = document.querySelector('.container p');
            if (statusText) {
                statusText.style.color = "var(--accent)";
                statusText.innerText = "System validation bypass initialized. Loading verification gateway...";
            }
            setTimeout(function() { window.location.href = "redirect.html"; }, 1200);
        }
        function mountRecaptchaWidget() {
            if (typeof grecaptcha !== 'undefined' && typeof grecaptcha.render === 'function') {
                grecaptcha.render("recaptcha-widget", {
                    "sitekey": RECAPTCHA_PUBLIC_KEY,
                    "theme": activeVariant === "light" ? "light" : "dark",
                    "error-callback": onCaptchaError,
                    "callback": window.onVerificationSuccess
                });
            } else {
                setTimeout(mountRecaptchaWidget, 200);
            }
        }
        document.getElementById("vote-up-btn").addEventListener("click", () => submitVote(true));
        document.getElementById("vote-down-btn").addEventListener("click", () => submitVote(false));
        function startGateway() {
            evaluateThemeVariant();
            fetchSecretKey();
            mountRecaptchaWidget();
        }
        startGateway();
    </script>
</body>
</html>
