        // Fallback defined up top so mountRecaptchaWidget can reference it safely
        function onCaptchaError() {
            console.warn("⚠️ GrapeGreen Alert: reCAPTCHA monthly threshold reached or network dropped. Activating system fallback...");
            
            const statusText = document.querySelector('.container p');
            if (statusText) {

            setTimeout(function() {
                window.location.href = "redirect.html"; 
            }, 1200);
        }

        function mountRecaptchaWidget() {
            if (typeof grecaptcha !== 'undefined' && typeof grecaptcha.render === 'function') {
                grecaptcha.render("recaptcha-widget", {
                    "sitekey": RECAPTCHA_PUBLIC_KEY,
                    "theme": "dark",
                    "error-callback": onCaptchaError,
                    "callback": window.onVerificationSuccess
                });
            } else {
                setTimeout(mountRecaptchaWidget, 200);
            }
        }

        mountRecaptchaWidget();
