<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Verification</title>
    
    <!-- Google reCAPTCHA API Script -->
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f9;
            margin: 0;
        }
        .container {
            text-align: center;
            padding: 30px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Security Verification</h2>
        <p>Please complete the verification challenge below to continue.</p>
        
        <!-- reCAPTCHA Container Node -->
        <div id="recaptcha-widget"></div>
    </div>

    <script type="module">
        // Import the functions you need from the SDKs you need
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-analytics.js";
        // TODO: Add SDKs for Firebase products that you want to use
        // https://firebase.google.com/docs/web/setup#available-libraries
        const RECAPTCHA_PUBLIC_KEY = "6LfV1PgtAAAAAIYTHM_VZn1zh0stTnJkDnGa3D0-";

        // Your web app's Firebase configuration
        // For Firebase JS SDK v7.20.0 and later, measurementId is optional
        const firebaseConfig = {
            apiKey: "AIzaSyAqy6NWFJ1KD9Cfv_WyqbMJJWCqlC5P7Es",
            authDomain: "app-iguess-39f2f.firebaseapp.com",
            databaseURL: "https://app-iguess-39f2f-default-rtdb.firebaseio.com",
            projectId: "app-iguess-39f2f",
            storageBucket: "app-iguess-39f2f.firebasestorage.app",
            messagingSenderId: "1056619953768",
            appId: "1:1056619953768:web:6ac154660c07c48a5005dd",
            measurementId: "G-J4736J0D8J"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);

        // Global verification window callback executes on successful completion
        window.onVerificationSuccess = function(token) {
            console.log("reCAPTCHA validation completed successfully!");
            // Automatically switch window path to destination file
            window.location.href = "redirect.html";
        };

        // Explicitly render widget using our hardcoded front-end key parameters
        function mountRecaptchaWidget() {
            if (typeof grecaptcha !== 'undefined' && typeof grecaptcha.render === 'function') {
                grecaptcha.render("recaptcha-widget", {
                    "sitekey": RECAPTCHA_PUBLIC_KEY,
                    "callback": window.onVerificationSuccess
                });
            } else {
                // If the external script is still downloading, wait 200ms and try again
                setTimeout(mountRecaptchaWidget, 200);
            }
        }

        // Initialize script environment tracking
        mountRecaptchaWidget();
    </script>
</body>
</html>
